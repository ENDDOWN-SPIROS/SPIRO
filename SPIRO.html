<div id="app">
  <!-- 1. Map stage: the first thing on the page -->
  <section id="intro" class="intro" hidden aria-labelledby="introTitle" tabindex="-1"></section>
  <main id="mapStage" class="stage">
    <div class="map-wrap">
      <div id="map" role="region" aria-label="Map of the Philippines with Metro Manila highlighted"></div>
      <div id="mapFallback" class="map-fallback" hidden></div>

      <!-- Module 5.1: primary map controls, in order: layer toggle, search, date/time -->
      <div class="ctrl-col" id="ctrlCol">
        <div class="ctrl-card ctrl-mode">
          <button type="button" id="navBtn" class="hamb" aria-label="Open menu" aria-expanded="false" aria-controls="navPanel"><span class="hb" aria-hidden="true"><i></i><i></i><i></i></span></button>
          <div class="seg layer-seg" id="layerSeg" role="radiogroup" aria-label="Map layer"></div>
        </div>
        <div class="ctrl-card ctrl-find" role="search">
          <label class="ctrl-title" for="topFind" id="topFindLbl">Search Location</label>
          <div class="top-search">
            <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
            <input id="topFind" type="search" placeholder="Type a city or place" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="topFindList">
            <ul id="topFindList" class="ts-list" role="listbox" aria-labelledby="topFindLbl" hidden></ul>
          </div>
          <p class="ts-msg" id="topFindMsg" hidden role="status"></p>
        </div>
        <section class="ctrl-card ctrl-time" id="timeBox" aria-labelledby="timeTitle"></section>
      </div>
      <a class="logo-ph" href="#intro" aria-label="SPIRO, open the introduction" title="About SPIRO"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg><b>SPIRO</b></a>

      <!-- Module A2: map controls and legend share the bottom-right corner -->
      <div class="br-stack">
      <div class="map-ctrls" id="mapCtrls" role="group" aria-label="Map controls">
        <button type="button" id="zIn" aria-label="Zoom in" title="Zoom in"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button type="button" id="zOut" aria-label="Zoom out" title="Zoom out"><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg></button>
        <button type="button" id="zNcr" aria-label="Zoom to Metro Manila" title="Metro Manila"><svg class="i" aria-hidden="true"><use href="#i-target"/></svg></button>
      </div>

      <div id="legend" class="legend" role="region" aria-label="Map legend" aria-live="polite"></div>
      </div>
      <div id="mapStatus" class="map-status" role="status"></div>
      <div id="mapLoading" class="map-loading">Loading map…</div>
    </div>

    <!-- Place details: overlays the map on wide screens, sits under the map on phones -->
    <aside id="placeCard" class="place-card" hidden aria-labelledby="placeTitle"></aside>
  </main>

  <!-- 2. Overlay menu opened by the hamburger -->
  <div id="navScrim" class="scrim" hidden></div>
  <nav id="navPanel" class="nav-panel" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle" tabindex="-1"></nav>

  <!-- 3. Panels: TB Health Guide, report form, Staff tools -->
  <div id="sheetScrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" hidden aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="Close panel and return to the map"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

</div>

<!-- Dialogs -->
<div id="modalScrim" class="scrim modal-scrim" hidden></div>
<div id="loginModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

const dateLabel = iso => { const d = parseIso(iso); return d ? d.toLocaleDateString("en-PH", { weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "No date"; };
const timeLabel = s => `${pad2(s.hour)}:${pad2(s.minute)}`;
const whenLabel = s => `${dateLabel(s.date)}, ${timeLabel(s)}`;

/* Real date and time of an ISO timestamp, in the viewer's locale and time zone. */
const dateTimeLabel = iso => {
  const d = new Date(iso);
  if (isNaN(d)) return "Unknown time";
  return d.toLocaleString("en-PH", { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
};

/* Seeded random numbers. No longer used by the TB data or the crowding proxy (both removed their random parts); kept for compatibility. */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  let a = hashStr(seed);
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* Storage wrappers that never throw (private windows and blocked storage return the fallback). */
const safeStorage = kind => ({
  get(key, fallback) { try { const v = window[kind].getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { window[kind].setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } },
  remove(key) { try { window[kind].removeItem(key); } catch (e) { /* ignore */ } }
});
const local = safeStorage("localStorage");
const session = safeStorage("sessionStorage");

/* Tiny event emitter used by the model. */
class Emitter {
  constructor() { this._h = {}; }
  on(evt, fn) { (this._h[evt] ||= []).push(fn); return () => this.off(evt, fn); }
  off(evt, fn) { this._h[evt] = (this._h[evt] || []).filter(f => f !== fn); }
  emit(evt, data) { (this._h[evt] || []).forEach(fn => fn(data)); }
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3400);
}

<script>
/* =====================================================================
   AppModel: reference data (cities, TB series, public places) and app state.
   Views never change state directly; controllers call the setters below,
   and the model emits "change" with the list of keys that changed.
   ===================================================================== */
"use strict";

/* ---------- Cities: 2025 projected population (DOH FHSIS Annual 2025); pop2020 = PSA 2020 Census ---------- */
const CITIES = [
  { id: "caloocan", name: "Caloocan", pop: 1743812, pop2020: 1661584 }, { id: "laspinas", name: "Las Piñas", pop: 628652, pop2020: 606293 },
  { id: "makati", name: "Makati", pop: 294960, pop2020: 629616 }, { id: "malabon", name: "Malabon", pop: 396996, pop2020: 380522 },
  { id: "mandaluyong", name: "Mandaluyong", pop: 442115, pop2020: 425758 }, { id: "manila", name: "Manila", pop: 1911556, pop2020: 1846513 },
  { id: "marikina", name: "Marikina", pop: 471918, pop2020: 456059 }, { id: "muntinlupa", name: "Muntinlupa", pop: 561640, pop2020: 543445 },
  { id: "navotas", name: "Navotas", pop: 260395, pop2020: 247543 }, { id: "paranaque", name: "Parañaque", pop: 716560, pop2020: 689992 },
  { id: "pasay", name: "Pasay", pop: 452062, pop2020: 440656 }, { id: "pasig", name: "Pasig", pop: 842708, pop2020: 803159 },
  { id: "qc", name: "Quezon City", pop: 3079478, pop2020: 2960048 }, { id: "sanjuan", name: "San Juan", pop: 128083, pop2020: 126347 },
  { id: "taguig", name: "Taguig", pop: 1271871, pop2020: 886722 }, { id: "valenzuela", name: "Valenzuela", pop: 745850, pop2020: 714978 },
  { id: "pateros", name: "Pateros", pop: 66990, pop2020: 65227, muni: true }
];
/* Module 5.1 (updated at Nea's request): pop = "Projected Population (All Ages)" for 2025 from
   DOH FHSIS Annual 2025, Table 2.F.7.1 (file "FINAL Tuberculosis_EB_2025.xlsx"), the same table as the
   2025 TB counts. NCR total 14,015,646 (equals the sum of the 17 rows). FHSIS projections follow the
   current city limits, so the EMBO barangays count under Taguig (Makati 294,960). pop2020 = PSA 2020
   Census of Population and Housing (Proclamation No. 1179, s. 2021), kept for reference. */
const NCR_POP = 14015646;
const POP_SOURCE = { short: "2025 projected (DOH FHSIS)", long: "DOH Field Health Services Information System (FHSIS) Annual 2025, Table 2.F.7.1, projected population (all ages), 2025." };
const CITY = Object.fromEntries(CITIES.map(c => [c.id, c]));
const cityName = id => id === "all" ? "All of NCR" : CITY[id].name + (CITY[id].muni ? " (municipality)" : "");

/* ---------- TB records ----------
   Module 1: TB values come only from data/shared/cleaned_tb_data.csv, loaded by
   assets/js/models/contract-loader.js and assets/js/models/tb-data-model.js
   (YEARS, yStatus, TB, tbVal, trendFor, TB_BREAKS, tbClass are defined there).
   The generated reference series that used to be here has been removed. */

/* ---------- Public places and typical-week busyness ----------
   Each value is a share (0–100) of that place's own busiest hour in a typical week,
   the way services such as BestTime report it. These are PROXY patterns: one assumed
   weekly shape per place type (mall, market, transit, tourist), the same for every place
   of that type. They are not measured for any specific place, not live readings and not
   headcounts. Module 5 removed the random per-place variation so the map no longer
   suggests place-specific measurements. */
const CATEGORY = {
  mall: { label: "Mall", open: [10, 22] },
  market: { label: "Public market", open: [4, 20] },
  transit: { label: "Transit station", open: [5, 23] },
  tourist: { label: "Tourist destination", open: [6, 21] }
};
const PLACES = (() => {
  const g = (h, mu, s) => Math.exp(-((h - mu) ** 2) / (2 * s * s));
  const PROFILE = {
    mall: (h, we, dow) => we ? .45 + .9 * g(h, 15.5, 3) : (.25 + .45 * g(h, 13, 2.5) + .75 * g(h, 18.5, 2)) * (dow === 5 && h >= 17 ? 1.12 : 1),
    market: (h, we) => we ? .2 + 1.0 * g(h, 7.5, 2.2) + .45 * g(h, 16, 2) : .15 + .9 * g(h, 7, 2) + .4 * g(h, 17, 2),
    transit: (h, we) => we ? .15 + .55 * g(h, 15, 4) : .22 + 1.0 * g(h, 7.5, 1.3) + .95 * g(h, 18, 1.5),
    tourist: (h, we) => we ? .15 + .95 * g(h, 16.5, 2.8) : .1 + .35 * g(h, 16, 3)
  };
  return window.VENUE_BASE.map(v => {
    const [o, c] = CATEGORY[v.cat].open;
    const week = [];
    for (let d = 0; d < 7; d++) {
      const row = [];
      for (let h = 0; h < 24; h++) row.push(h >= o && h < c ? PROFILE[v.cat](h, d === 0 || d === 6, d) : null);
      week.push(row);
    }
    const mx = Math.max(...week.flat().filter(x => x != null));
    return { ...v, week: week.map(row => row.map(x => x == null ? null : Math.round(100 * x / mx))) };
  });
})();
const PLACE = Object.fromEntries(PLACES.map(p => [p.id, p]));

function busyLevel(p) { if (p == null) return "Closed"; if (p < 40) return "Low"; if (p < 70) return "Moderate"; if (p < 90) return "High"; return "Very high"; }

/* ---------- The model ---------- */
class AppModel extends Emitter {
  constructor() {
    super();
    const now = new Date();
    this.state = {
      route: "map",           // map | overview | guide | report | admin
      adminTab: "tb",         // tb | crowd | reports
      layer: "tb",            // tb | crowd
      year: DEFAULT_YEAR,     // 2025 by default (Module 1)
      // Module 4: the map shows one TB indicator, case_count. The Cases | Per 100k switch was
      // removed; per-100k values stay in the staff tables, card and charts.
      date: isoDate(now),     // Module 5.1: chosen calendar date (sets the weekday)
      day: now.getDay(),
      hour: now.getHours(), minute: now.getMinutes(), second: 0,
      selected: null,         // { type: "city" | "place", id }
      navOpen: false,
      isAdmin: session.get("tbmap.adminSession", false) === true
    };
  }
  get(key) { return this.state[key]; }
  set(patch) {
    const changed = Object.keys(patch).filter(k => this.state[k] !== patch[k]);
    if (!changed.length) return;
    Object.assign(this.state, patch);
    if (changed.includes("isAdmin")) this.state.isAdmin ? session.set("tbmap.adminSession", true) : session.remove("tbmap.adminSession");
    this.emit("change", changed);
  }

  /* Place lookups shared by map, cards and the report form. */
  placeLabel(sel) {
    if (!sel) return "";
    return sel.type === "city" ? cityName(sel.id) : `${PLACE[sel.id].name}, ${CITY[PLACE[sel.id].city].name}`;
  }
  placeExists(sel) { return !!sel && (sel.type === "city" ? !!CITY[sel.id] : !!PLACE[sel.id]); }
  busyAt(place) { return place.week[this.state.day][this.state.hour]; }
}

<script>
/* Inline SVG charts (no chart library). Margins grow with the root font size so labels never clip. */
"use strict";

const Charts = (() => {
  const rootPx = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;

  function niceTicks(max, n = 4) {
    if (!(max > 0)) return [0, 1];
    const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
    const top = Math.ceil(max / step) * step, t = [];
    for (let v = 0; v <= top + 1e-9; v += step) t.push(v);
    return t;
  }

  function attachTip(el, svg, xs, html) {
    let tip = el.querySelector(".tip");
    if (!tip) { tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; el.appendChild(tip); }
    const hl = svg.querySelector(".hover-line");
    const move = e => {
      const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = vb.width / r.width;
      const x = (e.clientX - r.left) * sx; let bi = 0, bd = Infinity;
      xs.forEach((xx, i) => { const d = Math.abs(xx - x); if (d < bd) { bd = d; bi = i; } });
      const h = html(bi);
      if (!h) { tip.hidden = true; if (hl) hl.setAttribute("opacity", 0); return; }
      tip.innerHTML = h; tip.hidden = false;
      const er = el.getBoundingClientRect();
      const left = Math.max(80, Math.min(er.width - 80, xs[bi] / sx));
      tip.style.left = left + "px"; tip.style.top = (e.clientY - er.top) + "px";
      if (hl) { hl.setAttribute("x1", xs[bi]); hl.setAttribute("x2", xs[bi]); hl.setAttribute("opacity", 1); }
    };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerdown", move);
    svg.addEventListener("pointerleave", () => { tip.hidden = true; if (hl) hl.setAttribute("opacity", 0); });
  }

  /* Line chart. Missing values leave a gap; partial values get a hollow marker and dashed link. */
  function line(el, o) {
    const k = rootPx() / 16;
    const W = Math.max(260, el.clientWidth || 560), H = Math.round((o.height || 240) * Math.max(1, k * 0.95));
    const m = { t: 14 * k, r: 14 * k, b: 34 * k, l: 52 * k };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.labels.length;
    const all = o.series.flatMap(s => s.values).filter(v => v != null);
    if (!all.length) { el.innerHTML = `<p class="empty">No data for the selected filters.</p>`; return; }
    const ticks = niceTicks(Math.max(...all) * 1.05), top = ticks[ticks.length - 1];
    const X = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1)), Y = v => m.t + ih - v / top * ih;
    const every = Math.max(1, Math.ceil(n * 44 * k / iw));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Line chart")}">`;
    (o.gaps || []).forEach(i => { const w = iw / Math.max(1, n - 1) * 0.8; s += `<rect x="${X(i) - w / 2}" y="${m.t}" width="${w}" height="${ih}" fill="var(--surface-2)" stroke="var(--line)" stroke-dasharray="3 3"/>`; });
    ticks.forEach(t => { s += `<line class="grid-l" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${m.l - 6 * k}" y="${Y(t) + 4 * k}" text-anchor="end">${shortNum(t)}</text>`; });
    o.labels.forEach((l, i) => { if (i % every === 0 || i === o.hiIdx) s += `<text class="ax${o.hiIdx === i ? " hi" : ""}" x="${X(i)}" y="${H - m.b + 18 * k}" text-anchor="middle">${esc(l)}</text>`; });
    if (o.hiIdx != null) s += `<line x1="${X(o.hiIdx)}" x2="${X(o.hiIdx)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--primary)" stroke-opacity=".22" stroke-width="10"/>`;
    s += `<line class="hover-line" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>`;
    o.series.forEach(se => {
      let d = "", dd = "", pen = false;
      se.values.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        const partial = se.partial && se.partial(i);
        if (partial && i > 0 && se.values[i - 1] != null) { dd += `M${X(i - 1)},${Y(se.values[i - 1])}L${X(i)},${Y(v)}`; pen = false; return; }
        d += (pen ? "L" : "M") + X(i) + "," + Y(v); pen = true;
      });
      s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (dd) s += `<path d="${dd}" fill="none" stroke="${se.color}" stroke-width="2" stroke-dasharray="5 4"/>`;
      se.values.forEach((v, i) => { if (v == null) return; const p = se.partial && se.partial(i); s += `<circle cx="${X(i)}" cy="${Y(v)}" r="${p ? 4 : 3.4}" fill="${p ? "var(--surface)" : se.color}" stroke="${se.color}" stroke-width="2"/>`; });
    });
    s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/></svg>`;
    el.innerHTML = s;
    attachTip(el, el.querySelector("svg"), o.labels.map((_, i) => X(i)), i => {
      const rows = o.series.map(se => `<div><span class="tip-dot" style="background:${se.color}"></span>${esc(se.name)}: <b>${se.values[i] == null ? "no data" : (o.fmt || fmt)(se.values[i])}</b>${se.partial && se.partial(i) && se.values[i] != null ? " (partial)" : ""}</div>`).join("");
      return `<div class="tip-h">${esc(o.labels[i])}${o.tipNote ? " · " + esc(o.tipNote(i)) : ""}</div>${rows}`;
    });
  }

  /* Bar chart. */
  function bars(el, o) {
    const k = rootPx() / 16;
    const W = Math.max(260, el.clientWidth || 560), H = Math.round((o.height || 200) * Math.max(1, k * 0.95));
    const m = { t: 12 * k, r: 8 * k, b: 30 * k, l: 40 * k };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.values.length, bw = iw / n;
    const ticks = o.ticks || niceTicks(o.max || Math.max(1, ...o.values.filter(v => v != null)));
    const T = ticks[ticks.length - 1], Y = v => m.t + ih - v / T * ih;
    const every = o.labelEvery || Math.max(1, Math.ceil(n * 40 * k / iw));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Bar chart")}">`;
    ticks.forEach(t => s += `<line class="grid-l" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${m.l - 6 * k}" y="${Y(t) + 4 * k}" text-anchor="end">${t}${o.unit || ""}</text>`);
    o.values.forEach((v, i) => {
      const x = m.l + i * bw + bw * .14, w = Math.max(1, bw * .72), fill = o.color ? o.color(i, v) : "var(--primary)";
      s += v == null ? `<rect x="${x}" y="${m.t + ih - 2}" width="${w}" height="2" fill="var(--line-2)"/>`
        : `<rect x="${x}" y="${Y(v)}" width="${w}" height="${Math.max(1, m.t + ih - Y(v))}" rx="2" fill="${fill}"/>`;
      if (o.hi === i) s += `<rect x="${m.l + i * bw + 1}" y="${m.t}" width="${Math.max(2, bw - 2)}" height="${ih}" fill="none" stroke="var(--ink)" stroke-width="1.5" rx="3"/>`;
      if (i % every === 0) s += `<text class="ax" x="${m.l + i * bw + bw / 2}" y="${H - m.b + 17 * k}" text-anchor="middle">${esc(o.labels[i])}</text>`;
    });
    s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/></svg>`;
    el.innerHTML = s;
    attachTip(el, el.querySelector("svg"), o.values.map((_, i) => m.l + i * bw + bw / 2), i => o.tip ? o.tip(i) : `${esc(o.labels[i])}: <b>${o.values[i] ?? "–"}</b>`);
  }

  return { line, bars, niceTicks };
})();

</script>
<script>
/* =====================================================================
   MapView: Leaflet map of the Philippines with NCR highlighted.
   Two separate layers, never mixed:
     - TB cases: city choropleth in teal/blue, fixed classes for every year.
     - Crowding: smooth green-to-red heat around public places, from each
       place's typical-week busyness at the chosen day and hour.
   The view only draws. User actions go to the handlers set by MapController.
   ===================================================================== */
"use strict";

/* Module 4: the one TB indicator drawn on the map (case_count). The legend, colours, labels and
   tooltips all read it from here, so they can't disagree. */
const MAP_MEASURE = "count";
/* Legend rows built from the same edges tbClass() uses to colour the map. */
function tbLegendRows(measure) {
  const e = TB_BREAKS[measure].edges, f = v => fmt(v), sh = v => v >= 1000 ? `${+(v / 1000).toFixed(1)}k` : String(v);
  return TB_COLORS.map((color, i) => ({
    color,
    long: i === 0 ? `Under ${f(e[0])}` : i === e.length ? `${f(e[i - 1])} or more` : `${f(e[i - 1])}–${f(e[i] - 1)}`,
    short: i === 0 ? `<${sh(e[0])}` : `${sh(e[i - 1])}+`
  }));
}

const PH_BOUNDS = [[4.4, 116.6], [21.3, 127.0]];
const NCR_PSGC = 1300000000;
const CROWD_STOPS = [[0, "#2E9D4F"], [0.4, "#F2D43D"], [0.7, "#F28A1E"], [1, "#D42A1F"]];
const CROWD_LUT = (() => {
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), out = [];
  for (let i = 0; i < 256; i++) {
    const t = i / 255; let k = 0;
    while (k < CROWD_STOPS.length - 2 && t > CROWD_STOPS[k + 1][0]) k++;
    const [t0, c0] = CROWD_STOPS[k], [t1, c1] = CROWD_STOPS[k + 1], f = Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
    const a = hex(c0), b = hex(c1); out.push(a.map((x, j) => Math.round(x + (b[j] - x) * f)));
  }
  return out;
})();
const crowdRGB = t => CROWD_LUT[Math.max(0, Math.min(255, Math.round(t * 255)))];
const crowdCSS = t => `rgb(${crowdRGB(t).join(",")})`;
const CROWD_GRADIENT = `linear-gradient(90deg,${CROWD_STOPS.map(([t, c]) => `${c} ${t * 100}%`).join(",")})`;
const LEVEL_COLOR = { Low: crowdCSS(0.2), Moderate: crowdCSS(0.5), High: crowdCSS(0.8), "Very high": crowdCSS(1), Closed: "#9AA6AE" };

class MapView {
  constructor(model) {
    this.model = model;
    this.map = null;
    this.layers = {};
    this.handlers = {};
    this.mode = "loading";
    this.tileOk = false; this.tileErr = 0;
  }

  init(handlers) {
    this.handlers = handlers;
    $("#zIn").addEventListener("click", () => this.map && this.map.zoomIn());
    $("#zOut").addEventListener("click", () => this.map && this.map.zoomOut());
    $("#zNcr").addEventListener("click", () => this.focusNCR(true));
    this.renderLayerBar(); this.renderLegend(); this.renderStatus();
    if (!window.L) { this.mode = "fallback"; $("#mapLoading").hidden = true; this.renderStatus(); return; }
    this.mode = "leaflet";
    const m = this.map = L.map("map", { zoomControl: false, attributionControl: true, minZoom: 5, maxZoom: 18, zoomSnap: 0.5, maxBounds: L.latLngBounds(PH_BOUNDS).pad(0.35) });
    m.attributionControl.setPosition("bottomright");
    m.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, referrerPolicy: "strict-origin-when-cross-origin", attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' });
    m.attributionControl.addAttribution("Boundaries: PSGC 2023 (PSA)");
    tiles.on("tileload", () => { if (!this.tileOk) { this.tileOk = true; this.renderStatus(); } });
    tiles.on("tileerror", () => { this.tileErr++; if (this.tileErr === 1) setTimeout(() => this.renderStatus(), 1500); });
    tiles.addTo(m);
    this.focusNCR(false);
    this.buildBase();
    m.on("zoomend", () => { this.drawLabels(); this.drawPlaces(); });
    $("#mapLoading").hidden = true;
    this.draw();
    setTimeout(() => { m.invalidateSize(); this.focusNCR(false); }, 60);
  }

  /* ---------- top layer bar ---------- */
  renderLayerBar() {
    const s = this.model.state;
    const seg = items => items.map(([v, l, ic]) => `<button type="button" role="radio" aria-checked="${s.layer === v}" data-layer="${v}">${icon(ic)}<span>${l}</span></button>`).join("");
    $("#layerSeg").innerHTML = seg([["tb", "TB cases", "i-map"], ["crowd", "Crowding", "i-people"]]);
    $$("[data-layer]", $("#layerSeg")).forEach(b => b.addEventListener("click", () => this.handlers.onLayer(b.dataset.layer)));
    const box = $("#timeBox");
    if (s.layer === "tb") {
      const years = YEARS.map(y => opt(y, y + (yStatus(y).s === "complete" ? "" : ` (${yStatus(y).label.toLowerCase()})`), y === s.year)).join("");
      box.innerHTML = `<h2 class="ctrl-title" id="timeTitle">Reporting year</h2>
        <select id="lbYear" aria-labelledby="timeTitle">${years}</select>
        <p class="ctrl-note">TB data are yearly totals per city, so there is no date or time to choose here.</p>`;
      $("#lbYear").addEventListener("change", e => this.handlers.onYear(+e.target.value));
      return;
    }
    const nums = (n, cur) => [...Array(n).keys()].map(i => opt(i, pad2(i), i === cur)).join("");
    box.innerHTML = `<h2 class="ctrl-title" id="timeTitle">Date and time</h2>
      <div class="time-grid">
        <label class="tf tf-date"><span>Date</span><span class="tf-box">${icon("i-calendar")}<input type="date" id="lbDate" value="${s.date}" aria-label="Date" required></span></label>
        <div class="tf tf-time" role="group" aria-labelledby="lbTimeLbl"><span id="lbTimeLbl">Time (24-hour)</span>
          <span class="tf-box tf-hm">${icon("i-clock")}<select id="lbH" aria-label="Hour, 00 to 23">${nums(24, s.hour)}</select><b aria-hidden="true">:</b><select id="lbM" aria-label="Minute, 00 to 59">${nums(60, s.minute)}</select></span>
        </div>
      </div>`;
    $("#lbDate").addEventListener("change", e => { if (parseIso(e.target.value)) this.handlers.onDate(e.target.value); else e.target.value = this.model.state.date; });
    const t = () => this.handlers.onTime(+$("#lbH").value, +$("#lbM").value, 0);
    ["#lbH", "#lbM"].forEach(id => $(id).addEventListener("change", t));
  }

  /* ---------- base layers ---------- */
  buildBase() {
    const m = this.map;
    m.createPane("mask").style.zIndex = 330;
    m.createPane("heat").style.zIndex = 360; m.getPane("heat").style.pointerEvents = "none";
    m.createPane("labels").style.zIndex = 620; m.getPane("labels").style.pointerEvents = "none";
    const toLL = poly => poly.map(ring => ring.map(([x, y]) => [y, x]));
    /* Module 5.1: one gray mask over everything outside NCR (land and sea), with the exact
       NCR outline cut out, so the mask never overlaps or misses NCR's edge. */
    const WORLD = [[-10, 90], [-10, 150], [35, 150], [35, 90]];
    this.layers.mask = L.polygon([WORLD, ...window.NCR_OUTLINE], { pane: "mask", interactive: false, stroke: false, fillColor: "#7D8A92", fillOpacity: 0.5 }).addTo(m);
    m.createPane("ncrline").style.zIndex = 450; m.getPane("ncrline").style.pointerEvents = "none";
    /* NCR perimeter: white casing under a navy line, so it reads differently from a selected city's plain navy outline. */
    this.layers.ncrLine = L.layerGroup([
      L.polygon(window.NCR_OUTLINE, { pane: "ncrline", interactive: false, fill: false, color: "#FFFFFF", weight: 6, opacity: 0.85 }),
      L.polygon(window.NCR_OUTLINE, { pane: "ncrline", interactive: false, fill: false, color: "#122D40", weight: 2, opacity: 1 })]).addTo(m);
    this.layers.heat = this.makeHeatLayer().addTo(m);
    this.layers.cities = L.geoJSON(window.NCR_GEO, {
      style: f => this.cityStyle(f.properties.id),
      onEachFeature: (f, layer) => {
        const id = f.properties.id;
        layer.on("click", () => this.handlers.onSelect({ type: "city", id }));
        layer.on("mouseover", () => layer.setStyle({ weight: 3, color: "#0E2A3B", opacity: 1 }));
        layer.on("mouseout", () => { layer.setStyle(this.cityStyle(id)); const sel = this.model.state.selected; if (sel?.type === "city" && sel.id !== id) this.layers.cities.eachLayer(l => { if (l.feature.properties.id === sel.id) l.bringToFront(); }); });
        layer.bindTooltip(() => this.cityTip(id), { sticky: true, className: "tt", direction: "top", opacity: 1 });
      }
    }).addTo(m);
  }

  cityStyle(id) {
    const s = this.model.state, sel = s.selected?.type === "city" && s.selected.id === id;
    if (s.layer === "crowd") return { color: sel ? "#0E2A3B" : "#FFFFFF", weight: sel ? 3.2 : 1, opacity: sel ? 1 : 0.8, fillColor: "#000", fillOpacity: 0.001 };
    const v = tbVal(id, s.year, MAP_MEASURE), k = tbClass(v, MAP_MEASURE);
    return { color: sel ? "#0E2A3B" : "#FFFFFF", weight: sel ? 3.4 : 1.1, opacity: sel ? 1 : 0.9, dashArray: k < 0 ? "4 4" : null,
      fillColor: k < 0 ? "#9AA6AE" : TB_COLORS[k], fillOpacity: k < 0 ? 0.35 : 0.8 };
  }
  cityTip(id) {
    const s = this.model.state;
    if (s.layer === "crowd") {
      const n = PLACES.filter(p => p.city === id).length;
      return `<b>${esc(cityName(id))}</b><br>${n} listed public place${n === 1 ? "" : "s"} (crowding proxy)`;
    }
    const v = tbVal(id, s.year, MAP_MEASURE);
    return `<b>${esc(cityName(id))}</b><br>${v == null ? `No data for ${s.year}` : `${fmt(v)} TB cases, ${s.year}`}`;
  }

  /* ---------- crowd heat surface (canvas, clipped to NCR) ---------- */
  makeHeatLayer() {
    const view = this;
    const Heat = L.Layer.extend({
      onAdd(map) { this._map = map; this._c = L.DomUtil.create("canvas", "heat-canvas leaflet-zoom-hide"); this._c.setAttribute("aria-hidden", "true"); map.getPane("heat").appendChild(this._c); map.on("moveend resize", this.redraw, this); this.redraw(); },
      onRemove(map) { this._c.remove(); map.off("moveend resize", this.redraw, this); },
      redraw() {
        const map = this._map; if (!map) return;
        const size = map.getSize(), c = this._c, dpr = Math.min(2, window.devicePixelRatio || 1);
        L.DomUtil.setPosition(c, map.containerPointToLayerPoint([0, 0]));
        c.width = Math.round(size.x * dpr); c.height = Math.round(size.y * dpr); c.style.width = size.x + "px"; c.style.height = size.y + "px";
        const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, size.x, size.y);
        if (view.model.state.layer !== "crowd") return;
        /* Module 5.2: one continuous surface over all of NCR. Every cell takes the
           distance-weighted average of the estimated crowding at all listed places
           (closed = 0%), so colours between places are interpolated, not measured. */
        const S = 4, w = Math.ceil(size.x / S) + 1, h = Math.ceil(size.y / S) + 1, n = w * h;
        const mpp = 156543.03 * Math.cos(14.6 * Math.PI / 180) / Math.pow(2, map.getZoom());
        const eps2 = Math.pow(400 / mpp / S, 2);   // 400 m smoothing so a cell on a place is not a hard spike
        const pts = PLACES.map(p => { const b = view.model.busyAt(p), q = map.latLngToContainerPoint([p.lat, p.lng]); return [q.x / S, q.y / S, (b == null ? 0 : b) / 100]; });
        const f = document.createElement("canvas"); f.width = w; f.height = h;
        const fx = f.getContext("2d"), out = fx.createImageData(w, h), o = out.data;
        for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) {
          let num = 0, den = 0;
          for (const [px, py, v] of pts) { const d2 = (x - px) * (x - px) + (y - py) * (y - py) + eps2, k = 1 / (d2 * d2); num += v * k; den += k; }
          const [R, G, B] = crowdRGB(den ? num / den : 0);
          o[i * 4] = R; o[i * 4 + 1] = G; o[i * 4 + 2] = B; o[i * 4 + 3] = 168;
        }
        fx.putImageData(out, 0, 0);
        ctx.imageSmoothingEnabled = true; ctx.drawImage(f, 0, 0, w * S, h * S);
        ctx.globalCompositeOperation = "destination-in"; ctx.fillStyle = "#000"; ctx.beginPath();
        for (const ft of window.NCR_GEO.features) for (const poly of ft.geometry.coordinates) for (const ring of poly) {
          ring.forEach(([x, y], i) => { const q = map.latLngToContainerPoint([y, x]); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); }); ctx.closePath();
        }
        ctx.fill(); ctx.globalCompositeOperation = "source-over";
      }
    });
    return new Heat();
  }

  /* ---------- markers and labels ---------- */
  drawLabels() {
    if (this.mode !== "leaflet") return;
    if (this.layers.labels) this.map.removeLayer(this.layers.labels);
    const s = this.model.state, z = this.map.getZoom();
    if (z < 11 || window.SPIRO_SETTINGS?.labels === false) { this.layers.labels = null; return; }
    this.layers.labels = L.layerGroup(Object.entries(window.CITY_LABEL_PT).map(([id, ll]) => {
      const v = s.layer === "tb" ? tbVal(id, s.year, MAP_MEASURE) : null;
      const val = s.layer === "tb" ? `<em>${v == null ? "No data" : shortNum(v)}</em>` : "";
      const k = tbClass(v, MAP_MEASURE);
      return L.marker(ll, { pane: "labels", interactive: false, keyboard: false,
        icon: L.divIcon({ className: "city-label", iconSize: [0, 0], html: `<span class="${k >= 3 ? "on-dark" : ""}">${z >= 12 || s.layer === "crowd" ? `<b>${esc(CITY[id].name)}</b>` : ""}${val}</span>` }) });
    })).addTo(this.map);
  }

  drawPlaces() {
    if (this.mode !== "leaflet") return;
    if (this.layers.places) this.map.removeLayer(this.layers.places);
    this.layers.places = null;
    const s = this.model.state;
    if (s.layer !== "crowd" || s.selected?.type !== "place") return;
    const z = this.map.getZoom(), size = z >= 13 ? 18 : z >= 12 ? 14 : 11;
    this.layers.places = L.layerGroup(PLACES.filter(p => p.id === s.selected.id).map(p => {
      const b = this.model.busyAt(p), lv = busyLevel(b), sel = s.selected?.type === "place" && s.selected.id === p.id;
      const label = `${p.name}, ${CATEGORY[p.cat].label}. ${b == null ? "Usually closed" : `${lv} (${b}% of its busiest hour)`} on ${DOW[s.day]} at ${pad2(s.hour)}:00. Proxy: assumed typical pattern for this type of place, not measured.`;
      const mk = L.marker([p.lat, p.lng], { keyboard: true, title: label, alt: label, riseOnHover: true, zIndexOffset: sel ? 900 : 300,
        icon: L.divIcon({ className: "pm-wrap", iconSize: [size, size], html: `<span class="pm${sel ? " on" : ""}" style="--c:${LEVEL_COLOR[lv]}"></span>` }) });
      mk.bindTooltip(`<b>${esc(p.name)}</b><br>${esc(CATEGORY[p.cat].label)} · ${esc(CITY[p.city].name)}<br>${b == null ? "Usually closed at this hour" : `${lv}: ${b}% of its busiest hour`}<br><small>Proxy: typical pattern for a ${esc(CATEGORY[p.cat].label.toLowerCase())}. Not measured, not live.</small>`, { className: "tt", direction: "top", offset: [0, -size / 2] });
      mk.on("click", () => this.handlers.onSelect({ type: "place", id: p.id }));
      return mk;
    })).addTo(this.map);
  }

  /* ---------- draw everything for the current state ---------- */
  draw() {
    if (this.mode !== "leaflet") return;
    this.layers.cities.setStyle(f => this.cityStyle(f.properties.id));
    /* Draw the selected city last so its whole outline shows above its neighbours. */
    const sel = this.model.state.selected;
    if (sel?.type === "city") this.layers.cities.eachLayer(l => { if (l.feature.properties.id === sel.id) l.bringToFront(); });
    this.layers.heat.redraw();
    this.drawLabels(); this.drawPlaces();
  }

  render(changed) {
    const c = new Set(changed);
    if (["layer", "year", "isAdmin"].some(k => c.has(k))) this.renderLayerBar();
    if (["layer", "year", "day", "hour", "date", "minute", "second"].some(k => c.has(k))) this.renderLegend();
    if (["layer", "year", "day", "hour", "selected"].some(k => c.has(k))) this.draw();
  }

  /* ---------- legend (bottom right) ---------- */
  /* Legend: only the keys, always fully shown, compact (Nea, 2026-10-24: no sources, no NCR
     population, no "More about this layer"). */
  renderLegend() {
    const s = this.model.state;
    let h;
    if (s.layer === "tb") {
      const st = yStatus(s.year), empty = tbVal("all", s.year, MAP_MEASURE) == null;
      const n = Array(TB_COLORS.length + 1).fill(0);
      if (!empty) for (const c of CITIES) { const k = tbClass(tbVal(c.id, s.year, MAP_MEASURE), MAP_MEASURE); n[k < 0 ? TB_COLORS.length : k]++; }
      const row = (sw, label, x) => `<li>${sw}<span>${label}</span><span class="lg-n num" title="${x} of 17 cities">${x}</span></li>`;
      h = `<h3 class="lg-title">Notified TB cases, ${s.year}</h3>
        ${empty ? `<p class="lg-note">No data for ${s.year}.</p>` : `<ul class="lg-classes">${tbLegendRows(MAP_MEASURE).map((r, i) => row(`<span class="sw" style="background:${r.color}"></span>`, r.long, n[i])).join("")}${row('<span class="sw sw-na"></span>', "No data", n[TB_COLORS.length])}</ul>`}
        ${!empty && st.label !== "Full year" ? `<p class="lg-note">${esc(st.label)}</p>` : ""}`;
    } else {
      const lv = [["Low", "under 40%"], ["Moderate", "40–69%"], ["High", "70–89%"], ["Very high", "90%+"], ["Closed", "closed"]];
      h = `<h3 class="lg-title">Crowding (estimated)</h3>
        <div class="lg-grad" style="background:${CROWD_GRADIENT}"></div>
        <ul class="lg-ticks">${[0, 40, 70, 90].map(t => `<li style="left:${t}%">${t}%</li>`).join("")}</ul>
        <ul class="lg-classes">${lv.slice(0, 4).map(([k, t]) => `<li><span class="sw" style="background:${LEVEL_COLOR[k]}"></span><span>${k}</span><span class="lg-n">${t}</span></li>`).join("")}</ul>
        <p class="lg-note">Share of each place's busiest hour, blended between ${PLACES.length} listed places (closed counts as 0%). Typical week, not live.</p>`;
    }
    $("#legend").innerHTML = h;
  }

  /* Shown when the map library cannot load: the same city-level records as a table, no map. */
  renderFallback() {
    const y = this.model.state.year, rows = CITIES.map(c => [cityName(c.id), tbVal(c.id, y, MAP_MEASURE)]);
    const any = rows.some(r => r[1] != null);
    $("#mapFallback").innerHTML = `<div class="fb-inner"><h2>Notified TB cases by city, ${y}</h2>
      ${any ? `<table class="fb-table"><thead><tr><th scope="col">City or municipality</th><th scope="col" class="num">Notified TB cases</th></tr></thead>
      <tbody>${rows.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="num">${v == null ? "No data" : fmt(v)}</td></tr>`).join("")}</tbody></table>
      <p class="xs muted">Whole-city totals from cleaned_tb_data.csv. No map is drawn, so no locations are implied.</p>`
      : `<p class="small muted">${esc(yStatus(y).note)}</p>`}</div>`;
  }

  renderStatus() {
    let h = "";
    /* Module 5.1: notices about skipped data rows are shown only in Staff tools, Data and model. */
    if (this.mode === "leaflet" && !this.tileOk && this.tileErr > 0) h = `<span class="pill">${icon("i-info")}Street map tiles could not load. Boundaries and layers still work.${location.protocol === "file:" ? " Open the site through serve.ps1 (http://localhost:8000): OpenStreetMap blocks tiles for pages opened straight from disk." : ""}</span>`;
    if (location.protocol === "file:" && this.mode !== "fallback" && !this.tileErr) h = `<span class="pill">${icon("i-info")}Opened from disk. Run serve.ps1 and open http://localhost:8000 so the street map and data files can load.</span>`;
    if (this.mode === "fallback") {
      h = `<span class="pill">${icon("i-info")}The map could not load. TB records are shown as a table instead.</span>`;
      $("#mapFallback").hidden = false;
      this.renderFallback();
    }
    $("#mapStatus").innerHTML = h;
  }

  /* ---------- camera ---------- */
  pad() {
    const wide = window.innerWidth >= 900, col = $("#ctrlCol");
    if (wide) return { paddingTopLeft: [(col ? col.offsetWidth : 336) + 28, 24], paddingBottomRight: [70, 24] };
    return { paddingTopLeft: [16, (col ? col.offsetTop + col.offsetHeight : 160) + 12], paddingBottomRight: [56, 24] };
  }
  focusNCR(animate) { if (this.map) this.map.fitBounds(L.geoJSON(window.NCR_GEO).getBounds(), { ...this.pad(), animate }); }
  zoomTo(sel) {
    if (!this.map || !sel) return;
    if (sel.type === "place") { const p = PLACE[sel.id]; this.map.setView([p.lat, p.lng], Math.max(this.map.getZoom(), 14)); return; }
    this.layers.cities.eachLayer(l => { if (l.feature.properties.id === sel.id) this.map.fitBounds(l.getBounds(), { ...this.pad(), maxZoom: 12.5 }); });
  }
  invalidate() { if (this.map) setTimeout(() => { this.map.invalidateSize(); this.layers.heat?.redraw(); }, 60); }
}

</script>
<script>
/* =====================================================================
   NavigationView: hamburger menu (overlay panel) and the
   account button in the top bar.
   ===================================================================== */
"use strict";

class NavigationView {
  constructor(model) { this.model = model; this.handlers = {}; }

  init(handlers) {
    this.handlers = handlers;
    $("#navBtn").addEventListener("click", () => handlers.onToggleNav());
    $("#navScrim").addEventListener("click", () => handlers.onCloseNav());
    this.renderSearch();
    this.render(["navOpen", "isAdmin", "route"]);
  }

  render(changed) {
    const c = new Set(changed), s = this.model.state;
    if (c.has("isAdmin") || c.has("route") || c.has("navOpen")) this.renderPanel();
    if (c.has("navOpen")) this.setOpen(s.navOpen);
  }

  renderPanel() {
    const s = this.model.state, cur = s.route === "admin" ? "admin/" + s.adminTab : s.route, v = window.SPIRO_SETTINGS || {};
    const item = (route, ic, label, sub) => `<a class="np-item${cur === route ? " on" : ""}" href="#${route}" data-route="${route}"${cur === route ? ' aria-current="page"' : ""}>${icon(ic)}<span><b>${label}</b>${sub ? `<small>${sub}</small>` : ""}</span></a>`;
    const o = (val, l) => opt(val, l, (v.theme || "system") === val);
    $("#navPanel").innerHTML = `
      <div class="np-head">
        <h2 id="setTitle">Settings</h2>
        <button type="button" class="icon-btn" id="navClose" aria-label="Close settings">${icon("i-close")}</button>
      </div>
      <div class="np-group">
        <p class="np-label">Pages</p>
        ${item("intro", "i-info", "Introduction", "What SPIRO is and the problem it addresses")}
        ${item("map", "i-map", "Map", "TB cases and crowding")}
        ${item("guide", "i-book", "TB Health Guide", "Symptoms, prevention, getting checked")}
      </div>
      <div class="np-group">
        <p class="np-label">Display</p>
        <label class="np-set"><span>Theme</span><select id="setTheme">${o("system", "Device setting")}${o("light", "Light")}${o("dark", "Dark")}</select></label>
        <label class="np-set"><span>City names and values<small>Shown when zoomed in</small></span><input type="checkbox" role="switch" class="switch" id="setLabels"${v.labels !== false ? " checked" : ""}></label>
      </div>
      <div class="np-group">
        ${s.isAdmin ? `
          <p class="np-label">Staff tools</p>
          ${item("admin/tb", "i-chart", "TB history", "Cases and rates by year")}
          ${item("admin/crowd", "i-people", "Crowding report", "Busy hours by place")}
          ${item("admin/data", "i-info", "Data and model", "Shared files and model status")}
          <button type="button" class="np-item" id="npLogout">${icon("i-logout")}<span><b>Log out</b></span></button>`
        : `<button type="button" class="btn np-login" id="npLogin">Log In</button>`}
      </div>`;
    const p = $("#navPanel");
    $("#navClose").addEventListener("click", () => this.handlers.onCloseNav());
    $$("[data-route]", p).forEach(a => a.addEventListener("click", e => { e.preventDefault(); this.handlers.onNavigate(a.dataset.route); }));
    const upd = () => this.handlers.onPrefs({ theme: $("#setTheme").value, labels: $("#setLabels").checked });
    ["#setTheme", "#setLabels"].forEach(id => $(id).addEventListener("change", upd));
    $("#npLogin")?.addEventListener("click", () => this.handlers.onLogin());
    $("#npLogout")?.addEventListener("click", () => this.handlers.onLogout());
  }

  /* Module 5.1: search box in the top bar. Same sources as before: cities with TB records in
     cleaned_tb_data.csv, plus the listed public places. */
  renderSearch() {
    /* Cities first, then listed public places. Each row shows the name and its address as far
       as the data goes (city, Metro Manila); the place list has no street addresses. */
    const NCR_ADDR = "Metro Manila (NCR), Philippines";
    const cities = CITIES.map(c => ({ name: cityName(c.id), addr: NCR_ADDR, group: "City / municipality", sel: { type: "city", id: c.id } }))
      .sort((a, b) => a.name.localeCompare(b.name));
    const places = PLACES.map(p => ({ name: p.name, addr: `${CATEGORY[p.cat].label} · ${cityName(p.city)}, ${NCR_ADDR}`, group: "Public place", sel: { type: "place", id: p.id } }))
      .sort((a, b) => cityName(PLACE[a.sel.id].city).localeCompare(cityName(PLACE[b.sel.id].city)) || a.name.localeCompare(b.name));
    this.findIndex = [...cities, ...places];
    const inp = $("#topFind"), list = $("#topFindList"), msg = $("#topFindMsg");
    let hits = [], act = -1;
    const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const match = q => {
      if (!q) return cities;
      const n = norm(q);
      const score = o => { const a = norm(o.name), b = norm(o.addr); return a.startsWith(n) ? 0 : a.split(/[\s(-]+/).some(w => w.startsWith(n)) ? 1 : a.includes(n) ? 2 : b.includes(n) ? 3 : -1; };
      return this.findIndex.map((o, i) => [o, score(o), i]).filter(x => x[1] >= 0).sort((x, y) => (x[0].group === y[0].group ? 0 : x[0].group === "Public place" ? 1 : -1) || x[1] - y[1] || x[2] - y[2]).map(x => x[0]).slice(0, 12);
    };
    const box = inp.closest(".top-search");
    const close = () => { list.hidden = true; box.classList.remove("open"); inp.setAttribute("aria-expanded", "false"); inp.removeAttribute("aria-activedescendant"); act = -1; };
    const hl = t => { const q = inp.value.trim(); if (!q) return esc(t); const i = norm(t).indexOf(norm(q)); return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length)); };
    const paint = () => {
      let g = "";
      list.innerHTML = hits.map((o, i) => {
        const head = o.group !== g ? `<li class="ts-group" role="presentation">${o.group === "Public place" ? "Public places" : "Cities and municipality"}</li>` : ""; g = o.group;
        return `${head}<li role="option" id="tsOpt${i}" data-i="${i}" aria-selected="${i === act}" class="ts-opt${i === act ? " on" : ""}">${icon(o.sel.type === "city" ? "i-map" : "i-pin")}<span><b>${hl(o.name)}</b><small>${esc(o.addr)}</small></span></li>`;
      }).join("");
      list.hidden = !hits.length; box.classList.toggle("open", !!hits.length); inp.setAttribute("aria-expanded", String(!!hits.length));
      if (act >= 0) { inp.setAttribute("aria-activedescendant", "tsOpt" + act); $("#tsOpt" + act)?.scrollIntoView({ block: "nearest" }); } else inp.removeAttribute("aria-activedescendant");
    };
    const suggest = () => { msg.hidden = true; hits = match(inp.value.trim()); act = -1; paint(); if (!hits.length && inp.value.trim()) { msg.textContent = "No matching city or listed place."; msg.hidden = false; } };
    const pick = o => { inp.value = o.name; close(); inp.blur(); this.handlers.onFind(o.sel); };
    inp.addEventListener("input", suggest);
    inp.addEventListener("focus", suggest);
    inp.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (list.hidden) suggest(); if (!hits.length) return; act = (act + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; paint(); }
      else if (e.key === "Enter") { e.preventDefault(); const o = hits[act >= 0 ? act : 0]; if (o) pick(o); else if (inp.value.trim()) { msg.textContent = "No matching city or listed place."; msg.hidden = false; } }
      else if (e.key === "Escape") { if (!list.hidden) close(); else { inp.value = ""; msg.hidden = true; } }
    });
    list.addEventListener("mousedown", e => e.preventDefault());
    list.addEventListener("click", e => { const li = e.target.closest("[data-i]"); if (li) pick(hits[+li.dataset.i]); });
    inp.addEventListener("blur", () => setTimeout(() => { close(); msg.hidden = true; }, 150));
  }

  /* Module 4: cities come only from cleaned_tb_data.csv (cities with at least one valid case
     count). Public places are the modelled crowding layer's places and are listed as such. */
  setOpen(open) {
    const p = $("#navPanel"), btn = $("#navBtn");
    p.hidden = !open; $("#navScrim").hidden = !open;
    btn.setAttribute("aria-expanded", open);
    btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    if (open) { requestAnimationFrame(() => (p.querySelector(".np-item.on") || p.querySelector(".np-item"))?.focus()); }
  }
}

</script>
<script>
/* =====================================================================
   PlaceDetailsView: the card for a selected city or public place.
   Shows TB figures (city), typical busyness (place), a row of preventive
   and precautionary measures.
   ===================================================================== */
"use strict";

/* Short, general guidance. Not personal medical advice. */
const PREVENTION = [
  { id: "mask", icon: "p-mask", label: "Mask", text: "If you are coughing or feel unwell, wear a well-fitted mask around other people, especially indoors and in public transport. A mask also helps when you have to spend time close to someone who is coughing." },
  { id: "crowd", icon: "p-crowd", label: "Distance", text: "Avoid long periods in close contact in crowded indoor spaces when you can. TB spreads through the air, and risk grows with time spent close together in enclosed, poorly ventilated places. Choosing less busy hours helps." },
  { id: "vent", icon: "p-vent", label: "Ventilate", text: "Open windows and doors, and use fans that move air outdoors. Good airflow lowers the amount of TB bacteria in shared indoor air at home, at work and in vehicles." },
  { id: "cough", icon: "p-cough", label: "Cover cough", text: "Cover your mouth and nose with a tissue or the inside of your elbow when you cough or sneeze. Throw tissues away right after use." },
  { id: "checkup", card: false, icon: "p-checkup", label: "Get checked", text: "A cough lasting two weeks or more, fever, night sweats or weight loss can be signs of TB. Visit a barangay health station, city health office or TB DOTS facility. TB testing and treatment are free in public health facilities." },
  { id: "hands", icon: "p-hands", label: "Wash hands", text: "TB spreads through the air, not by touching surfaces. Washing your hands with soap and water is still a good habit that prevents many other infections." }
];

class PlaceDetailsView {
  constructor(model) { this.model = model; this.handlers = {}; this.openTip = null; }
  init(handlers) { this.handlers = handlers; }

  render() {
    const s = this.model.state, card = $("#placeCard");
    if (!s.selected || !this.model.placeExists(s.selected) || s.route !== "map") { card.hidden = true; card.innerHTML = ""; card.classList.remove("pc-enter"); document.body.classList.remove("has-card"); this.lastKey = null; return; }
    const sel = s.selected, key = sel.type + ":" + sel.id, y = card.scrollTop;
    card.innerHTML = sel.type === "city" ? this.cityHTML(sel.id) : this.placeHTML(PLACE[sel.id]);
    card.hidden = false; document.body.classList.add("has-card");
    this.bind(card, sel);
    card.scrollTop = key === this.lastKey ? y : 0;
    /* slide in when a new city or place opens, not on every time change */
    if (key !== this.lastKey) { card.classList.remove("pc-enter"); void card.offsetWidth; card.classList.add("pc-enter"); }
    this.lastKey = key;
  }

  head(eyebrow, title) {
    return `<div class="pc-head"><div>${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ""}<h2 id="placeTitle" tabindex="-1"${eyebrow ? "" : ' class="city-name"'}>${esc(title)}</h2></div>
      <button type="button" class="icon-btn" id="pcClose" aria-label="Close place details">${icon("i-close")}</button></div>`;
  }

  cityHTML(id) {
    return this.model.state.layer === "crowd" ? this.cityCrowdHTML(id) : this.cityTbHTML(id);
  }

  /* Module 5.1: latest TB observation for a city, from the period columns of cleaned_tb_data.csv.
     Never the current date or a file date. */
  latestTb(id) {
    const ys = (TbData.years || []).filter(y => TB[id]?.[y]?.count != null);
    if (!ys.length) return null;
    const y = ys[ys.length - 1], row = TB[id][y].row || {}, raw = row.period_end, st = row.period_start;
    const d = raw instanceof Date ? raw : (typeof raw === "string" && parseIso(raw.slice(0, 10)));
    const type = (row.period_type || "annual").toLowerCase();
    if (!d) return { y, text: `${y} (${type} total; end date not given)` };
    const sd = st instanceof Date ? st : (typeof st === "string" ? parseIso(st.slice(0, 10)) : null);
    const span = sd ? `${sd.toLocaleDateString("en-PH", { month: "short", year: "numeric" })} to ${d.toLocaleDateString("en-PH", { month: "short", year: "numeric" })}` : `${y}`;
    return { y, text: `${d.toLocaleDateString("en-PH", { month: "long", year: "numeric" })}`, sub: `${type} total, ${span}` };
  }

  cityTbHTML(id) {
    const s = this.model.state, y = s.year, d = TB[id][y], admin = s.isAdmin;
    const k = tbClass(d.count, "count"), tr = trendFor(id), last = this.latestTb(id);
    const ranked = CITIES.map(c => [c.id, TB[c.id][y].rate]).filter(p => p[1] != null).sort((a, b) => b[1] - a[1]), rk = ranked.findIndex(p => p[0] === id);
    const noFile = !TbData.available();
    return `${this.head("", cityName(id))}
      <section class="pc-sec" aria-label="TB summary">
        ${d.count == null
          ? `<p class="empty-state">${noFile ? "No TB case data has been loaded yet." : `No TB case count for ${esc(CITY[id].name)} in ${y}.`}</p>`
          : `<div class="kpi"><span class="kpi-l">Notified TB cases, ${y}</span><span class="kpi-v"><span class="sw" style="background:${TB_COLORS[k]}"></span>${fmt(d.count)}</span></div>`}
        <dl class="pc-kv">
          ${d.population != null ? `<dt>Population, ${y}</dt><dd>${fmt(d.population)} <small class="muted">(projected)</small></dd>` : `<dt>Population</dt><dd>${fmt(CITY[id].pop)} <small class="muted">(2025 projected)</small></dd>`}
          <dt>Last updated</dt><dd>${last ? `${esc(last.text)}${last.sub ? `<br><small class="muted">${esc(last.sub)}</small>` : ""}` : "No observation available"}</dd>
          ${admin && d.rate != null ? `<dt>Per 100,000</dt><dd>${fmt(d.rate, 1)}</dd><dt>Rank by rate</dt><dd>${rk + 1} of ${ranked.length}</dd><dt>Trend ${TREND_FROM ?? "–"}–${TREND_TO ?? "–"}</dt><dd>${this.trendText(tr)}</dd>` : ""}
        </dl>
        <p class="pc-src">Notified cases (all forms), not incidence. Source: cleaned_tb_data.csv${d.row?.source_file ? ` (${esc(d.row.source_file)})` : ""}. Population: ${d.population != null ? `the projected population in the same DOH FHSIS table for ${y}` : esc(POP_SOURCE.long)}.</p>
        ${admin ? DataModelView.cityPredictionsHTML(id) : ""}
        ${admin ? `<div class="chart" id="pcSpark" data-city="${id}"></div>` : ""}
      </section>
      ${this.preventionHTML()}`;
  }

  /* Module 5.1: no defensible city-level crowding indicator exists in this project (no measured
     occupancy or headcounts), so no Low/Moderate/High level is assigned to a city. */
  cityCrowdHTML(id) {
    return `${this.head("", cityName(id))}
      <section class="pc-sec" aria-labelledby="pcRisk">
        <h3 id="pcRisk">Crowding risk level</h3>
        <p><span class="risk-badge">Unavailable</span></p>
        <p class="small">Overcrowding risk cannot be assessed from the currently available data.</p>
        <dl class="pc-kv"><dt>Observation period</dt><dd>None</dd><dt>Data type</dt><dd>Unavailable (no measured data)</dd></dl>
        <p class="pc-src">There are no measured occupancy or headcount data for NCR cities here. The coloured halos are an assumed typical week for listed places only, so they are not used to rate a city.</p>
      </section>
      ${this.preventionHTML()}`;
  }

  placeHTML(p) {
    const s = this.model.state, b = this.model.busyAt(p), lv = busyLevel(b);
    return `${this.head(`${esc(CATEGORY[p.cat].label)} · ${esc(cityName(p.city))}`, p.name)}
      <section class="pc-sec" aria-labelledby="pcBusy">
        <h3 id="pcBusy">Crowding, ${esc(whenLabel(s))}</h3>
        <p class="big-num"><span class="lvl" style="--c:${LEVEL_COLOR[lv]}">${lv}</span><small>${b == null ? "usually closed at this hour" : `${b}% of its busiest hour`}</small></p>
        <div class="chart" id="pcDay" data-place="${p.id}"></div>
        <p class="pc-src">Estimated: the assumed typical week for a ${esc(CATEGORY[p.cat].label.toLowerCase())}, not measured here and not live.</p>
        <p class="remind">Reminder: A busy place is not evidence that TB is spreading there.</p>
      </section>
      ${this.preventionHTML()}`;
  }

  trendText(t) { return t.dir === "Insufficient" ? "Not enough data" : `${t.dir} (${pct(t.pct)}/yr)`; }

  preventionHTML() {
    return `<section class="pc-sec" aria-labelledby="pcPrev">
      <h3 id="pcPrev">Take Precautionary Measures</h3>
      <div class="prev-row" role="group" aria-label="Preventive measures. Select one to read more.">
        ${PREVENTION.filter(p => p.card !== false).map(p => `<button type="button" class="prev-btn" data-prev="${p.id}" title="${p.label}" aria-expanded="${this.openTip === p.id}" aria-controls="prevDesc"><span class="prev-ic">${icon(p.icon)}</span><span class="prev-lb">${p.label}</span></button>`).join("")}
      </div>
      <div id="prevDesc" class="prev-desc" ${this.openTip ? "" : "hidden"} role="region" aria-live="polite">${this.openTip ? this.prevText(this.openTip) : ""}</div>
    </section>`;
  }
  prevText(id) { const p = PREVENTION.find(x => x.id === id); return `<b>${p.label}.</b> ${esc(p.text)} <a href="#guide" data-route="guide">TB Health Guide</a>`; }

  bind(card, sel) {
    $("#pcClose", card).addEventListener("click", () => this.handlers.onClose());
    $$("[data-place]", card).forEach(b => b.tagName === "BUTTON" && b.addEventListener("click", () => this.handlers.onSelect({ type: "place", id: b.dataset.place })));
    $$("[data-route]", card).forEach(a => a.addEventListener("click", e => { e.preventDefault(); this.handlers.onNavigate(a.dataset.route); }));
    $$(".prev-btn", card).forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.prev; this.openTip = this.openTip === id ? null : id;
      $$(".prev-btn", card).forEach(x => x.setAttribute("aria-expanded", x.dataset.prev === this.openTip));
      const d = $("#prevDesc", card); d.hidden = !this.openTip; d.innerHTML = this.openTip ? this.prevText(this.openTip) : "";
      $$("[data-route]", d).forEach(a => a.addEventListener("click", e => { e.preventDefault(); this.handlers.onNavigate(a.dataset.route); }));
    }));
    const sp = $("#pcSpark", card);
    if (sp) {
      const id = sp.dataset.city, s = this.model.state;
      Charts.line(sp, { labels: YEARS.map(String), height: 150, hiIdx: YEARS.indexOf(s.year), gaps: YEARS.map((y, i) => ["missing", "unavailable"].includes(yStatus(y).s) ? i : null).filter(i => i != null),
        series: [{ name: "Per 100,000", color: "#1F6FA3", values: YEARS.map(y => tbVal(id, y, "rate")), partial: i => yStatus(YEARS[i]).s === "partial" }],
        fmt: x => fmt(x, 1), tipNote: i => yStatus(YEARS[i]).label, aria: `TB cases per 100,000 in ${CITY[id].name} by year` });
    }
    const dy = $("#pcDay", card);
    if (dy) {
      const p = PLACE[dy.dataset.place], s = this.model.state, row = p.week[s.day];
      Charts.bars(dy, { labels: [...Array(24).keys()].map(h => h % 6 === 0 ? hourLabel(h).replace(" ", "") : ""), labelEvery: 1, values: row, max: 100, ticks: [0, 50, 100], unit: "%", height: 130, hi: s.hour,
        color: (i, v) => crowdCSS(v / 100), tip: i => `${hourLabel(i)}<br><b>${row[i] == null ? "Closed" : row[i] + "% · " + busyLevel(row[i])}</b>`, aria: `Typical crowding at ${p.name} through ${DOW[s.day]}` });
    }
  }
}

</script>
<script>
/* =====================================================================
   HealthGuideView: public TB Health Guide (symptoms, prevention, where to
   get checked). General information only; no facilities are listed by name.
   ===================================================================== */
"use strict";

const HealthGuideView = {
  title: "TB Health Guide",
  html() {
    return `<div class="guide">
      <p class="lead">General information for residents and visitors of Metro Manila. For advice about your own health, talk to a health worker.</p>
      <nav class="chips" aria-label="Guide sections">
        <a class="chip" href="#g-sym" data-jump="g-sym">Symptoms</a>
        <a class="chip" href="#g-prev" data-jump="g-prev">How to prevent TB</a>
        <a class="chip" href="#g-care" data-jump="g-care">Where to get checked</a>
        <a class="chip" href="#g-more" data-jump="g-more">More information</a>
      </nav>

      <section class="g-sec" aria-labelledby="g-what-h">
        <h3 id="g-what-h">What TB is</h3>
        <p>Tuberculosis (TB) is an infectious disease caused by bacteria. It most often affects the lungs. TB spreads through the air when a person with active lung TB coughs, speaks or sings, and people nearby breathe in the bacteria. Spending long periods close together in enclosed, poorly ventilated spaces raises the chance of exposure. TB is preventable and curable with a full course of treatment.</p>
      </section>

      <section class="g-sec" id="g-sym" aria-labelledby="g-sym-h" tabindex="-1">
        <h3 id="g-sym-h">Symptoms</h3>
        <ul class="g-list">
          <li>Cough lasting two weeks or more</li>
          <li>Coughing up phlegm or blood</li>
          <li>Fever, often in the afternoon or evening</li>
          <li>Night sweats</li>
          <li>Weight loss without trying</li>
          <li>Chest pain, tiredness or loss of appetite</li>
        </ul>
        <p class="small muted">Some people with TB have mild symptoms or none at all, which is why people who live with someone who has TB should also get checked.</p>
      </section>

      <section class="g-sec" id="g-prev" aria-labelledby="g-prev-h" tabindex="-1">
        <h3 id="g-prev-h">How to prevent TB</h3>
        <ul class="g-prev">
          ${PREVENTION.map(p => `<li><span class="prev-ic">${icon(p.icon)}</span><div><b>${p.label}</b><p>${esc(p.text)}</p></div></li>`).join("")}
          <li><span class="prev-ic">${icon("i-hosp")}</span><div><b>Finish treatment</b><p>People on TB treatment should take every dose until the course is complete. Stopping early can make TB harder to treat.</p></div></li>
          <li><span class="prev-ic">${icon("i-check")}</span><div><b>BCG vaccination for babies</b><p>Infants receive the BCG vaccine under the national immunization schedule. Ask your health center about it.</p></div></li>
        </ul>
      </section>

      <section class="g-sec" id="g-care" aria-labelledby="g-care-h" tabindex="-1">
        <h3 id="g-care-h">Where to get checked</h3>
        <p>If you have a cough for two weeks or more, or other symptoms above, visit your <b>barangay health station</b>, your <b>city or municipal health office</b>, or a <b>TB DOTS facility</b>. TB testing and treatment are free in public health facilities in the Philippines. Your barangay health station can tell you where the nearest TB DOTS facility is.</p>
        <p class="notice warn">${icon("i-info")}<span>If you have trouble breathing, cough up a lot of blood or feel very ill, get emergency care right away. The national emergency hotline is <b>911</b>.</span></p>
        <p class="small">Visitors to Metro Manila who feel unwell can go to any public health center or hospital.</p>
      </section>

      <section class="g-sec" aria-labelledby="g-com-h">
        <h3 id="g-com-h">For commuters and visitors</h3>
        <p>Crowded trains, terminals and markets are part of daily life in Metro Manila. Travelling at less busy hours, keeping vehicle windows open where possible and wearing a mask when you are coughing are practical habits. The crowding layer on the map shows a modelled estimate of when places are usually busy; it is not live and it does not label any place as safe or unsafe.</p>
        <p class="remind">Reminder: A busy place is not evidence that TB is spreading there.</p>
      </section>

      <section class="g-sec" id="g-more" aria-labelledby="g-more-h" tabindex="-1">
        <h3 id="g-more-h">More information</h3>
        <ul class="res-list">
          <li><a href="https://doh.gov.ph/" target="_blank" rel="noopener">${icon("i-ext")}Department of Health (Philippines)</a></li>
          <li><a href="https://www.who.int/news-room/fact-sheets/detail/tuberculosis" target="_blank" rel="noopener">${icon("i-ext")}World Health Organization: tuberculosis fact sheet</a></li>
          <li><a href="https://www.cdc.gov/tb/" target="_blank" rel="noopener">${icon("i-ext")}US CDC: tuberculosis basics</a></li>
        </ul>
        <p class="xs muted">This website is not a diagnostic tool. It cannot tell whether a person has TB or whether a place is safe.</p>
      </section>
    </div>`;
  },
  bind(root) {
    $$("[data-jump]", root).forEach(a => a.addEventListener("click", e => {
      e.preventDefault(); const t = document.getElementById(a.dataset.jump);
      if (t) { t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); t.focus({ preventScroll: true }); }
    }));
  }
};

</script>
<script>
/* =====================================================================
   AdminView: Staff tools shown after log in.
     - TB history: filters, chart and table by city and year
     - Crowding report: typical-week busy hours by place
     - Community reports: review queue and reporting history
   ===================================================================== */
"use strict";

const ADMIN_TABS = { tb: "TB history", crowd: "Crowding report", data: "Data and model" };

class AdminView {
  constructor(model) {
    this.model = model; this.handlers = {};
    this.f = { city: "all", measure: "count", compare: true, cCity: "all", cCat: "all", cDay: model.state.day };
  }
  init(handlers) { this.handlers = handlers; }

  html(tab) {
    const tabs = Object.entries(ADMIN_TABS).map(([k, l]) => `<button type="button" role="tab" id="tab-${k}" aria-selected="${tab === k}" aria-controls="adminPanel" tabindex="${tab === k ? 0 : -1}" data-tab="${k}">${l}</button>`).join("");
    const body = tab === "crowd" ? this.crowdHTML() : tab === "data" ? DataModelView.html() : this.tbHTML();
    return `<div class="admin">
      <p class="notice">${icon("i-lock")}<span>Staff tools are open in this browser tab only. Sign-in is not connected to an account server yet, so these pages are not protected.</span></p>
      <div class="tabs" role="tablist" aria-label="Staff tools">${tabs}</div>
      <div id="adminPanel" role="tabpanel" aria-labelledby="tab-${tab}" tabindex="0">${body}</div></div>`;
  }

  /* ---------- TB history ---------- */
  tbHTML() {
    const f = this.f, cityOpts = opt("all", "All of NCR", f.city === "all") + CITIES.map(c => opt(c.id, cityName(c.id), f.city === c.id)).join("");
    const rows = CITIES.map(c => ({ c, v: YEARS.map(y => tbVal(c.id, y, f.measure)), t: trendFor(c.id) }))
      .sort((a, b) => (tbVal(b.c.id, DEFAULT_YEAR, f.measure) ?? -1) - (tbVal(a.c.id, DEFAULT_YEAR, f.measure) ?? -1));
    const cell = (v, y) => v == null ? `<td class="na" title="${esc(yStatus(y).label)}">–</td>` : `<td class="num${yStatus(y).s === "partial" ? " partial" : ""}">${f.measure === "rate" ? fmt(v, 1) : fmt(v)}${yStatus(y).s === "partial" ? "*" : ""}</td>`;
    return `${TbData.available() ? "" : `<p class="notice warn">${icon("i-info")}<span>${esc(TbData.unavailableText())} TB history fills in once data/shared/cleaned_tb_data.csv is provided. See the Data and model tab.</span></p>`}
      <div class="filters">
        <div class="field"><label for="afCity">City or municipality</label><select id="afCity">${cityOpts}</select></div>
        <div class="field"><span class="label" id="afMeasL">Measure</span><div class="seg" role="radiogroup" aria-labelledby="afMeasL">
          <button type="button" role="radio" aria-checked="${f.measure === "count"}" data-afm="count">Cases</button><button type="button" role="radio" aria-checked="${f.measure === "rate"}" data-afm="rate">Per 100,000</button></div></div>
        ${f.city !== "all" && f.measure === "rate" ? `<label class="check"><input type="checkbox" role="switch" class="switch" id="afCompare" ${f.compare ? "checked" : ""}> Compare with all of NCR</label>` : ""}
      </div>
      <div class="card">
        <h3>${f.measure === "rate" ? "TB cases per 100,000 people" : "TB cases"}: ${esc(cityName(f.city))}, ${YEARS[0]}–${YEARS[YEARS.length - 1]}</h3>
        <div class="chart" id="afChart"></div>
        <ul class="chart-key"><li><i style="background:#1F6FA3"></i>${esc(cityName(f.city))}</li>${f.city !== "all" && f.measure === "rate" && f.compare ? `<li><i style="background:#8A9AA6"></i>All of NCR</li>` : ""}<li><i class="gap"></i>No records for that year in cleaned_tb_data.csv</li></ul>
        ${f.city !== "all" ? `<p class="small">Trend ${TREND_FROM ?? "–"}–${TREND_TO ?? "–"} (complete years only): <b>${this.trend(trendFor(f.city))}</b>.</p>` : ""}
      </div>
      <div class="card">
        <h3>By city and year</h3>
        <div class="table-wrap" tabindex="0" role="region" aria-label="TB ${f.measure === "rate" ? "rates" : "cases"} by city and year"><table class="data">
          <thead><tr><th scope="col">City</th>${YEARS.map(y => `<th scope="col" class="num">${y}</th>`).join("")}<th scope="col">Trend ${TREND_FROM ?? "–"}–${TREND_TO ?? "–"}</th></tr></thead>
          <tbody>${rows.map(r => `<tr><th scope="row"><button type="button" class="link" data-afcity="${r.c.id}">${esc(r.c.name)}</button></th>${r.v.map((v, i) => cell(v, YEARS[i])).join("")}<td>${this.trend(r.t)}</td></tr>`).join("")}</tbody>
        </table></div>
        <p class="xs muted">– No valid value in cleaned_tb_data.csv for that city and year (never filled in). Sorted by ${DEFAULT_YEAR}. Rates are case_rate_per_100k as given in the file. Trend: yearly change in the rate, fitted over years where all 17 cities have values; above +3% a year is increasing, below −3% decreasing.</p>
      </div>`;
  }
  trend(t) { return t.dir === "Insufficient" ? "Not enough data" : `${t.dir} (${pct(t.pct)}/yr)`; }

  /* ---------- crowding ---------- */
  crowdHTML() {
    const f = this.f;
    const list = PLACES.filter(p => (f.cCity === "all" || p.city === f.cCity) && (f.cCat === "all" || p.cat === f.cCat));
    const hours = [...Array(19).keys()].map(i => i + 5);
    const cityOpts = opt("all", "All of NCR", f.cCity === "all") + CITIES.filter(c => PLACES.some(p => p.city === c.id)).map(c => opt(c.id, c.name, f.cCity === c.id)).join("");
    const catOpts = opt("all", "All types", f.cCat === "all") + Object.entries(CATEGORY).map(([k, c]) => opt(k, c.label, f.cCat === k)).join("");
    return `<div class="filters">
        <div class="field"><label for="acCity">City</label><select id="acCity">${cityOpts}</select></div>
        <div class="field"><label for="acCat">Type of place</label><select id="acCat">${catOpts}</select></div>
        <div class="field"><label for="acDay">Day</label><select id="acDay">${DOW.map((d, i) => opt(i, d, i === f.cDay)).join("")}</select></div>
      </div>
      <div class="card">
        <h3>Usual crowding by hour, ${DOW[f.cDay]} (${list.length} place${list.length === 1 ? "" : "s"})</h3>
        <p class="small muted">Typical week, as a share of each place's busiest hour. Proxy: assumed pattern per place type, not a headcount, measurement or live reading. Select a place to open it on the map.</p>
        ${list.length ? `<div class="table-wrap" tabindex="0" role="region" aria-label="Usual crowding by hour"><table class="grid-tbl">
          <thead><tr><th scope="col">Place</th>${hours.map(h => `<th scope="col"><span>${h % 12 || 12}${h < 12 ? "a" : "p"}</span></th>`).join("")}<th scope="col">Busiest</th></tr></thead>
          <tbody>${list.map(p => { const row = p.week[f.cDay], mx = Math.max(...row.filter(x => x != null)), hi = row.indexOf(mx);
            return `<tr><th scope="row"><button type="button" class="link" data-acplace="${p.id}">${esc(p.name)}</button><small>${esc(CATEGORY[p.cat].label)} · ${esc(CITY[p.city].name)}</small></th>${hours.map(h => row[h] == null ? `<td class="gc closed" title="${hourLabel(h)}: closed">·</td>` : `<td class="gc" style="background:${crowdCSS(row[h] / 100)}" title="${hourLabel(h)}: ${row[h]}% (${busyLevel(row[h])})"><span class="sr-only">${hourLabel(h)} ${row[h]}%</span></td>`).join("")}<td class="xs">${hi >= 0 ? hourLabel(hi) : "–"}</td></tr>`; }).join("")}</tbody>
        </table></div>
        <div class="lg-inline"><span>Less busy</span><span class="lg-ramp" style="background:${CROWD_GRADIENT}"></span><span>Busier</span><span class="closed-key">· Closed</span></div>` : `<p class="small">No places match these filters.</p>`}
        <p class="remind">Reminder: A busy place is not evidence that TB is spreading there.</p>
      </div>`;
  }

  /* ---------- events and charts ---------- */
  bind(root, tab) {
    const h = this.handlers, re = () => h.onRerender();
    $$("[data-tab]", root).forEach(b => {
      b.addEventListener("click", () => h.onTab(b.dataset.tab));
      b.addEventListener("keydown", e => {
        const keys = Object.keys(ADMIN_TABS), i = keys.indexOf(b.dataset.tab);
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); const n = keys[(i + (e.key === "ArrowRight" ? 1 : keys.length - 1)) % keys.length]; h.onTab(n, true); }
      });
    });
    const on = (sel, evt, fn) => { const el = $(sel, root); if (el) el.addEventListener(evt, fn); };
    on("#afCity", "change", e => { this.f.city = e.target.value; re(); });
    $$("[data-afm]", root).forEach(b => b.addEventListener("click", () => { this.f.measure = b.dataset.afm; re(); }));
    on("#afCompare", "change", e => { this.f.compare = e.target.checked; re(); });
    $$("[data-afcity]", root).forEach(b => b.addEventListener("click", () => { this.f.city = b.dataset.afcity; re(); $("#afCity")?.focus(); }));
    on("#acCity", "change", e => { this.f.cCity = e.target.value; re(); });
    on("#acCat", "change", e => { this.f.cCat = e.target.value; re(); });
    on("#acDay", "change", e => { this.f.cDay = +e.target.value; re(); });
    $$("[data-acplace]", root).forEach(b => b.addEventListener("click", () => h.onOpenPlace({ type: "place", id: b.dataset.acplace }, this.f.cDay)));

    const ch = $("#afChart", root);
    if (ch) {
      const f = this.f, series = [{ name: cityName(f.city), color: "#1F6FA3", values: YEARS.map(y => tbVal(f.city, y, f.measure)), partial: i => yStatus(YEARS[i]).s === "partial" }];
      if (f.city !== "all" && f.measure === "rate" && f.compare) series.push({ name: "All of NCR", color: "#8A9AA6", values: YEARS.map(y => tbVal("all", y, "rate")), partial: i => yStatus(YEARS[i]).s === "partial" });
      Charts.line(ch, { labels: YEARS.map(String), height: 240, series, gaps: YEARS.map((y, i) => ["missing", "unavailable"].includes(yStatus(y).s) ? i : null).filter(i => i != null),
        fmt: x => f.measure === "rate" ? fmt(x, 1) : fmt(x), tipNote: i => yStatus(YEARS[i]).label, aria: `TB ${f.measure === "rate" ? "cases per 100,000" : "cases"} by year for ${cityName(f.city)}` });
    }
  }
}

</script>
<script>
/* =====================================================================
   LoginView: front-end log-in screen for health office staff.
   There is no account server, so nothing typed here is checked, stored
   or sent. Continuing only switches this browser tab to the Staff tools.
   The dialog says so plainly and lists what is still needed.
   ===================================================================== */
"use strict";

const LoginView = {
  open(handlers, opener) {
    const m = $("#loginModal");
    this._opener = opener || document.activeElement;
    m.innerHTML = `<div class="modal-in">
      <div class="modal-head"><h2 id="loginTitle">Log In</h2>
        <button type="button" class="icon-btn" id="loginClose" aria-label="Close log in">${icon("i-close")}</button></div>
      <p class="small">For health office staff: TB history, the crowding report, and data and model status. The map and TB Health Guide stay open to everyone.</p>
      <p class="notice warn">${icon("i-info")}<span><b>Sign-in is not connected yet.</b> This is the log-in screen only. The email and password are not checked, saved or sent anywhere, and anyone can open the staff tools from here. Do not use a real password.</span></p>
      <form id="loginForm" novalidate>
        <div class="field"><label for="lgEmail">Work email</label><input type="email" id="lgEmail" autocomplete="off" aria-describedby="lgEmail-e"><span class="err" id="lgEmail-e" hidden></span></div>
        <div class="field"><label for="lgPass">Password</label><input type="password" id="lgPass" autocomplete="off" aria-describedby="lgPass-e"><span class="err" id="lgPass-e" hidden></span></div>
        <div class="form-actions"><button type="submit" class="btn primary">${icon("i-lock")}Continue</button><button type="button" class="btn ghost" id="loginCancel">Cancel</button></div>
      </form>
      <details class="needs"><summary>What a real log-in still needs</summary>
        <ul class="small">
          <li>An account server or identity provider (for example, a government single sign-on) that checks passwords</li>
          <li>Accounts and roles for health office staff, managed by an administrator</li>
          <li>A backend that only returns staff data to signed-in users</li>
          <li>Secure hosting over HTTPS, session expiry and an audit log</li>
        </ul>
      </details>
    </div>`;
    m.hidden = false; $("#modalScrim").hidden = false;
    const close = () => this.close();
    $("#loginClose").addEventListener("click", close);
    $("#loginCancel").addEventListener("click", close);
    $("#loginForm").addEventListener("submit", e => {
      e.preventDefault();
      const email = $("#lgEmail").value.trim(), pass = $("#lgPass").value, errs = {};
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) errs.lgEmail = "Enter an email address, like name@example.gov.ph.";
      if (!pass) errs.lgPass = "Enter a password.";
      $$("#loginForm .err").forEach(x => { x.hidden = true; x.textContent = ""; });
      $$("#loginForm [aria-invalid]").forEach(x => x.removeAttribute("aria-invalid"));
      Object.entries(errs).forEach(([k, msg]) => { const er = $("#" + k + "-e"); er.textContent = msg; er.hidden = false; $("#" + k).setAttribute("aria-invalid", "true"); });
      if (Object.keys(errs).length) { $("#" + Object.keys(errs)[0]).focus(); return; }
      $("#loginForm").reset();                // nothing is kept
      this._opener = null;
      this.close();
      handlers.onContinue();
    });
    $("#lgEmail").focus();
  },
  close() {
    const m = $("#loginModal"); if (m.hidden) return;
    m.hidden = true; m.innerHTML = ""; $("#modalScrim").hidden = true;
    this._opener?.focus?.();
  },
  isOpen() { return !$("#loginModal").hidden; }
};

</script>
