<!-- Controllers -->
<script>
/* =====================================================================
   MapController: map layer, filters and place selection.
   ===================================================================== */
"use strict";

class MapController {
  constructor(model, mapView, placeView, app) {
    this.model = model; this.view = mapView; this.placeView = placeView; this.app = app;
  }

  init() {
    this.view.init({
      /* Module 5.1: switching layer closes the open card and the Settings overlay. */
      onLayer: layer => { if (layer !== this.model.state.layer) this.model.set({ layer, selected: null, navOpen: false }); },
      onYear: year => this.model.set({ year }),
      onDate: date => this.model.set({ date, day: parseIso(date).getDay() }),
      onTime: (hour, minute, second) => this.model.set({ hour, minute, second }),
      onSelect: sel => this.select(sel, false)
    });
    this.placeView.init({
      onClose: () => this.clear(),
      onSelect: sel => this.select(sel, true),
      onNavigate: route => this.app.navigate(route)
    });
  }

  select(sel, zoom) {
    this.model.set(sel.type === "place" ? { selected: sel, layer: "crowd" } : { selected: sel });
    if (zoom) this.view.zoomTo(sel);
    if (window.innerWidth < 900) setTimeout(() => $("#placeCard")?.scrollTo({ top: 0 }), 0);
  }
  clear() { this.model.set({ selected: null }); $("#map").focus?.(); }
}

</script>
<script>
/* =====================================================================
   AppController: routes, the overlay menu, panels (TB Health Guide,
   report form, Staff tools) and the front-end log-in.

   Routes (URL hash):
     #map               map (default)
     #overview          public introduction
     #guide             TB Health Guide panel
     #report            report overcrowding panel
     #admin/tb | #admin/crowd | #admin/reports   Staff tools (after log in)
   ===================================================================== */
"use strict";

/* Module 5.1: display preferences shown in the Settings overlay. Per-browser conveniences in localStorage. */
const SETTINGS_KEY = "spiro.settings.v1";
const Prefs = {
  defaults: { theme: "system", labels: true, markers: true },
  load() { const v = safeStorage("localStorage").get(SETTINGS_KEY, {}); return { ...this.defaults, ...(v && typeof v === "object" ? v : {}) }; },
  save(v) { safeStorage("localStorage").set(SETTINGS_KEY, v); },
  apply(v) { if (v.theme === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v.theme; }
};

class AppController {
  constructor() {
    this.model = new AppModel();
    this.mapView = new MapView(this.model);
    this.navView = new NavigationView(this.model);
    this.placeView = new PlaceDetailsView(this.model);
    this.adminView = new AdminView(this.model);
    this.mapCtl = new MapController(this.model, this.mapView, this.placeView, this);
    this.settings = Prefs.load(); Prefs.apply(this.settings); window.SPIRO_SETTINGS = this.settings;
    this.pendingRoute = null;
  }

  start() {
    this.navView.init({
      onToggleNav: () => this.model.set({ navOpen: !this.model.state.navOpen }),
      onCloseNav: () => this.closeNav(true),
      onNavigate: route => { this.closeNav(false); this.navigate(route); },
      onFind: sel => { this.closeNav(false); this.navigate("map"); this.mapCtl.select(sel, true); setTimeout(() => $("#placeTitle")?.focus({ preventScroll: true }), 350); },
      onLogin: () => { this.closeNav(false); this.openLogin(null); },
      onLogout: () => { this.closeNav(false); this.logout(); },
      onPrefs: v => { this.settings = v; window.SPIRO_SETTINGS = v; Prefs.save(v); Prefs.apply(v); this.mapView.drawLabels(); this.mapView.drawPlaces(); }
    });
    this.mapCtl.init();
    this.adminView.init({
      onTab: (tab, focus) => { this.navigate("admin/" + tab); if (focus) setTimeout(() => $("#tab-" + tab)?.focus(), 0); },
      onRerender: () => this.renderSheet(true),
      onOpenPlace: (sel, day) => {
        /* pick the next calendar date with that weekday, so the date and the pattern agree */
        const d = new Date(); d.setDate(d.getDate() + ((day - d.getDay() + 7) % 7));
        this.model.set({ layer: "crowd", day, date: isoDate(d) }); this.navigate("map"); this.mapCtl.select(sel, true);
      }
    });

    this.model.on("change", changed => this.onModelChange(changed));

    $("#sheetClose").addEventListener("click", () => this.navigate("map"));
    $("#sheetScrim").addEventListener("click", () => this.navigate("map"));
    $("#modalScrim").addEventListener("click", () => LoginView.close());
    $("[data-skip]").addEventListener("click", e => { e.preventDefault(); $("#map").setAttribute("tabindex", "-1"); $("#map").focus(); });
    document.addEventListener("keydown", e => this.onKey(e));
    window.addEventListener("hashchange", () => this.applyRoute());
    window.addEventListener("resize", () => { clearTimeout(this._rz); this._rz = setTimeout(() => this.rerenderCharts(), 200); });
    this.placeCardSlot();
    this.applyRoute();
  }

  /* On wide screens the selected card floats in the top-right corner, under the logo and above
     the map controls; on narrow screens it sits under the map. */
  placeCardSlot() {
    const br = $(".br-stack"), set = () => document.documentElement.style.setProperty("--br-h", (br ? br.offsetHeight : 0) + "px");
    if (br && window.ResizeObserver) new ResizeObserver(set).observe(br); set();
    this.mapView.invalidate();
  }

  /* ---------- routing ---------- */
  navigate(route, opts = {}) {
    if (location.hash.slice(1) === route) this.applyRoute(); else location.hash = route;
  }
  parse() {
    const h = location.hash.replace(/^#/, "");
    if (h.startsWith("admin")) return { route: "admin", tab: ADMIN_TABS[h.split("/")[1]] ? h.split("/")[1] : "tb" };
    if (["guide", "dictionary"].includes(h)) return { route: h };  /* Module 5.1: #report and #overview removed; they open the map */
    if (h === "" || h === "intro") return { route: "intro" };       /* the introduction is the first page on opening the site */
    return { route: "map" };
  }
  applyRoute() {
    const r = this.parse();
    if (r.route === "admin" && !this.model.state.isAdmin) {
      history.replaceState(null, "", "#map");
      this.model.set({ route: "map" });
      this.showRoute();
      this.openLogin("admin/" + r.tab);
      return;
    }
    /* Module 5.1: leaving the map closes map popups and the Settings overlay. */
    const leave = r.route !== this.model.state.route;
    this.model.set({ route: r.route, ...(r.tab ? { adminTab: r.tab } : {}), ...(leave ? { navOpen: false } : {}), ...(leave && r.route !== "map" ? { selected: null } : {}) });
    this.showRoute();
  }
  showRoute() {
    const route = this.model.state.route;
    this.mapView.invalidate();
    const sheetOpen = ["guide", "admin", "dictionary"].includes(route);
    $("#sheet").hidden = !sheetOpen; $("#sheetScrim").hidden = !sheetOpen;
    document.body.classList.toggle("sheet-open", sheetOpen);
    if (sheetOpen) { this.renderSheet(false); $("#sheet").focus({ preventScroll: true }); }
    const intro = route === "intro", ib = $("#intro");
    if (intro) { this.renderIntro(); if (ib.hidden) { ib.hidden = false; ib.scrollTop = 0; ib.focus({ preventScroll: true }); } } else ib.hidden = true;
    $("#mapStage").toggleAttribute("inert", intro); $("#mapStage").setAttribute("aria-hidden", String(intro));
    this.placeView.render();
    document.title = { intro: "SPIRO · Metro Manila TB map", map: "SPIRO", guide: "TB Health Guide · SPIRO", admin: "Staff tools · SPIRO", dictionary: "Data dictionary · SPIRO" }[route];
    if (ContractData.source.test) document.title = "[TEST DATA] " + document.title;
  }

  renderSheet(keepScroll) {
    const s = this.model.state, body = $("#sheetBody"), y = body.scrollTop;
    const active = document.activeElement && document.activeElement.id;
    $("#sheet").dataset.kind = s.route;
    if (s.route === "guide") { $("#sheetTitle").textContent = HealthGuideView.title; body.innerHTML = HealthGuideView.html(); HealthGuideView.bind(body); }
    else if (s.route === "dictionary") { $("#sheetTitle").textContent = "Data dictionary"; body.innerHTML = DataModelView.dictionaryHTML(); }
    else if (s.route === "admin") { $("#sheetTitle").textContent = "Staff tools: " + ADMIN_TABS[s.adminTab]; body.innerHTML = this.adminView.html(s.adminTab); this.adminView.bind(body, s.adminTab); }
    body.scrollTop = keepScroll ? y : 0;
    if (keepScroll && active && document.getElementById(active)) document.getElementById(active).focus({ preventScroll: true });
  }

  /* ---------- model changes ---------- */
  onModelChange(changed) {
    const c = new Set(changed);
    /* Module 5.1: the menu/Settings overlay closes when something is selected on the map. */
    if (c.has("selected") && this.model.state.selected && this.model.state.navOpen) this.model.set({ navOpen: false });
    this.mapView.render(changed);
    this.navView.render(changed);
    if (["selected", "year", "day", "hour", "date", "minute", "second", "isAdmin", "layer"].some(k => c.has(k))) this.placeView.render();
    if (c.has("selected") && !c.has("route")) this.mapView.invalidate();
  }
  rerenderCharts() {
    this.placeView.render();
    if (["admin"].includes(this.model.state.route)) this.renderSheet(true);
    this.mapView.invalidate();
  }

  /* ---------- menu ---------- */
  closeNav(returnFocus) { if (!this.model.state.navOpen) return; this.model.set({ navOpen: false }); if (returnFocus) $("#navBtn").focus(); }

  /* ---------- log in / log out (front end only) ---------- */
  openLogin(route) {
    this.pendingRoute = route;
    LoginView.open({
      onContinue: () => {
        this.model.set({ isAdmin: true });
        toast("Staff tools are open in this tab. Sign-in is not verified yet.");
        this.navigate(this.pendingRoute || "admin/tb");
        this.pendingRoute = null;
      }
    });
  }
  logout() {
    this.model.set({ isAdmin: false });
    toast("Logged out. Staff tools are closed.");
    if (this.model.state.route === "admin") this.navigate("map");
  }

  /* ---------- keyboard ---------- */
  /* Introduction page. Numbers come from the loaded files; nothing is typed in by hand. */
  renderIntro() {
    const y = DEFAULT_YEAR, n = tbVal("all", y, MAP_MEASURE), nc = CITIES.length;
    const stat = (v, l) => `<div class="in-stat"><b class="num">${v}</b><span>${l}</span></div>`;
    $("#intro").innerHTML = `
      <header class="in-top"><span class="in-brand"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg><b>SPIRO</b></span>
        <a class="btn" href="#guide">${icon("i-book")}TB Health Guide</a></header>
      <div class="in-wrap">
        <div class="in-hero">
          <p class="eyebrow">Metro Manila · tuberculosis and crowding</p>
          <h1 id="introTitle">SPIRO</h1>
          <p class="in-lead">A map that shows where tuberculosis (TB) cases are reported across the 17 cities and municipality of Metro Manila, and when busy public places tend to be crowded, so people and health offices can plan safer visits and focus prevention.</p>
          <div class="cta"><a class="btn primary in-go" href="#map">${icon("i-map")}Explore the map${icon("i-arrow")}</a><a class="btn" href="#guide">${icon("i-book")}Learn about TB</a></div>
        </div>
        <div class="in-stats">
          ${stat(n == null ? "—" : fmt(n), n == null ? `notified TB cases, ${y} (data not loaded)` : `notified TB cases in Metro Manila, ${y}`)}
          ${stat(nc, "cities and municipality on the map")}
          ${stat(PLACES.length, "public places with crowding estimates")}
        </div>
        <section class="in-sec" aria-labelledby="inProb"><h2 id="inProb">The problem</h2>
          <p>TB spreads through the air. Risk grows when people spend long periods close together in crowded, poorly ventilated indoor places, such as malls, public markets and transit stations. ${n == null ? "Metro Manila reports thousands of TB cases every year" : `Metro Manila notified ${fmt(n)} TB cases in ${y} (DOH FHSIS)`}, yet the public has no simple way to see where cases are reported or when shared spaces are busiest, and health offices have no single view that puts the two together.</p></section>
        <section class="in-sec" aria-labelledby="inHow"><h2 id="inHow">What SPIRO shows</h2>
          <div class="in-cards">
            <article class="in-card">${icon("i-map", 22)}<h3>TB cases by city</h3><p>Notified TB cases per city from DOH FHSIS records, ${YEARS[0]}–${y}, with ${y} shown first.</p></article>
            <article class="in-card">${icon("i-people", 22)}<h3>Crowding heatmap</h3><p>An estimated typical-week pattern for ${PLACES.length} malls, markets, stations and landmarks, blended into one map. Pick a date and time.</p></article>
            <article class="in-card">${icon("p-mask", 22)}<h3>Precautions</h3><p>Simple steps for each place, plus a TB Health Guide on symptoms and free testing in public health facilities.</p></article>
          </div></section>
        <p class="in-note">${icon("i-info")}<span>Crowding is an estimate, not live. A busy place is not evidence that TB is spreading there.</span></p>
        <p class="in-src">Data: DOH Field Health Services Information System (FHSIS) TB tables · PSA PSGC 2023 boundaries · © OpenStreetMap contributors.</p>
      </div>`;
    $$("#intro a[href^='#']").forEach(a => a.addEventListener("click", e => { e.preventDefault(); this.navigate(a.getAttribute("href").slice(1)); }));
  }

  onKey(e) {
    if (e.key !== "Escape") return;
    if (LoginView.isOpen()) { LoginView.close(); return; }
    if (this.model.state.navOpen) { this.closeNav(true); return; }
    if (!$("#sheet").hidden) { this.navigate("map"); return; }
    if (this.model.state.selected) this.mapCtl.clear();
  }
}

</script>
<!-- Entry point -->
<script>
/* Entry point: build the controller and start the app once the page is ready. */
"use strict";

(function boot() {
  /* Module 1: read the shared data contract files first, then start. A failed load still
     starts the app, with every file in an honest missing/error state. */
  const start = async () => {
    try { Object.assign(ContractData, await ContractLoader.loadAll()); }
    catch (e) { ContractData.tb = { file: CONTRACT.tb.file, state: "error", message: "Loading failed: " + e.message }; }
    TbData.setData(ContractData.tb);
    PredData.setData(ContractData.pred);
    DataModelView.renderBanner();
    window.tbApp = new AppController(); window.tbApp.start();
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
